name: BrainLLM GitHub Pages
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: Check out repository
      - name: Validate required files
        run: |
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
      - name: Check relative asset paths
        run: |
          grep -q 'href="./styles.css"' site/index.html
          grep -q 'src="./app.js"' site/index.html
      - name: Check JavaScript syntax
        run: node --check site/app.js
      - name: Check internal pages and API wiring
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('site/index.html', 'utf8');
          const js = fs.readFileSync('site/app.js', 'utf8');
          const css = fs.readFileSync('site/styles.css', 'utf8');
          for (const page of ['overview','chat','agents','personality','architecture','api','docs']) {
            if (!html.includes('id="page-' + page + '"')) throw new Error('Missing page: ' + page);
          }
          for (const asset of ['styles.css','app.js']) {
            if (!html.includes('./' + asset)) throw new Error('Missing relative reference: ' + asset);
          }
          if (!js.includes("fetch(origin+path")) throw new Error('API fetch is missing');
          if (!css.includes('@media(max-width:560px)')) throw new Error('Responsive breakpoint missing');
          console.log('Static-site checks passed.');
          NODE
  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        name: Check out repository
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
