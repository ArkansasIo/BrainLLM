# Default Configuration for BrainLLM

# Neural Network Configuration
[brain]
num_layers=8
neurons_per_layer=256
learning_rate=0.001
max_memory_size=10000
memory_decay_rate=0.95

# Attention Mechanism
num_attention_heads=8
attention_dim=512

# Language Model
vocab_size=2048
embedding_dim=768
context_length=1024
batch_size=32
temperature=0.7

# UI Configuration
[ui]
dark_mode=true
window_width=1920
window_height=1080
maximize_on_start=false
font_size=12.0
theme=dark

# API Configuration
[api]
host=localhost
port=8080
enable_cors=true
max_connections=100
api_key=

# Logging
[logging]
log_level=INFO
log_file=brainllm.log
enable_console_output=true

# Database and spreadsheet export
[database]
dialect=sqlite
database_path=data/brainllm.db
schema_path=data/schema/brainllm_schema.sql
spreadsheet_layout_path=data/spreadsheets/brainllm_layout.csv
auto_migrate=true
export_csv_on_shutdown=false

# Lua scripting
[lua]
enabled=true
script_root=scripts/lua
bootstrap_script=scripts/lua/system/bootstrap.lua
allow_user_scripts=false

# Woman voice and audio
[voice]
enabled=true
default_profile=woman_default
language=en-US
pitch_hz=220.0
speaking_rate=1.0
warmth=0.75
asset_root=assets/audio/woman
