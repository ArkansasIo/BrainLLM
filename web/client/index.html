<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BrainLLM Client</title>
  <link rel="stylesheet" href="/client/styles.css">
</head>
<body>
  <main class="shell">
    <section class="panel chat-panel">
      <header class="topbar">
        <div>
          <h1>BrainLLM</h1>
          <p id="serverLine">Connecting to local brain server...</p>
        </div>
        <div class="status-pill" id="statusPill">Checking</div>
      </header>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="chatForm">
        <textarea id="promptInput" rows="3" placeholder="Ask, explain, summarize, remember, or use wolfram: integral x^2"></textarea>
        <div class="composer-actions">
          <label>
            <span>Max tokens</span>
            <input id="maxTokens" type="number" min="16" max="2048" value="220">
          </label>
          <button type="button" id="resetButton">Reset</button>
          <button type="submit" id="sendButton">Send</button>
        </div>
      </form>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>Runtime</h2>
        <dl class="metrics">
          <div><dt>Confidence</dt><dd id="confidence">0.00</dd></div>
          <div><dt>Accuracy</dt><dd id="accuracy">0.00</dd></div>
          <div><dt>Tokens</dt><dd id="tokens">0</dd></div>
          <div><dt>Memory</dt><dd id="memoryUsage">0.00</dd></div>
        </dl>
      </section>

      <section class="panel">
        <h2>AirLLM</h2>
        <form id="airllmForm" class="stack">
          <label>Model id<input id="modelId" placeholder="huggyllama/llama-7b"></label>
          <label>Python<input id="pythonExecutable" value="python"></label>
          <label>Max new tokens<input id="airTokens" type="number" min="1" max="4096" value="128"></label>
          <label class="check"><input id="useCuda" type="checkbox" checked> Use CUDA</label>
          <button type="submit">Save AirLLM</button>
          <p id="airllmState" class="muted">Not loaded yet.</p>
        </form>
      </section>

      <section class="panel">
        <h2>Memory Search</h2>
        <form id="memoryForm" class="stack">
          <input id="memoryQuery" placeholder="Search memory">
          <button type="submit">Recall</button>
        </form>
        <div id="memoryResults" class="memory-results"></div>
      </section>
    </aside>
  </main>
  <script src="/client/app.js"></script>
</body>
</html>
